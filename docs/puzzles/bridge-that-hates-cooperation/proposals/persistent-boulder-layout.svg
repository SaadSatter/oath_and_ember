<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1500" viewBox="0 0 1440 1500"><defs><marker id="gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ffd36c"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#d4a5ff"/></marker></defs><rect width="1440" height="1500" fill="#0e1a22"/><text x="48" y="58" font-family="Arial,sans-serif" font-size="34" fill="#ffe1ad">THE BRIDGE THAT HATES COOPERATION</text><text x="48" y="98" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">APPROVAL DRAFT · Strict top-down · 30 × 48 tiles · Separate banks, one persistent boulder</text><text x="48" y="132" font-family="Arial,sans-serif" font-size="18" fill="#a8bbc4">NORTH ↑  /  progression from south to north      Gold = Sieg + boulder      Purple = Coco      Cyan = control link</text><g transform="translate(48,170) scale(.7)"><rect x="0" y="0" width="960" height="1536" rx="5" fill="#233c30" stroke="#6d8a85" stroke-width="2"/><rect x="384" y="288" width="192" height="1056" rx="5" fill="#12556a" stroke="#48a7b8" stroke-width="2"/><rect x="192" y="256" width="192" height="1088" rx="5" fill="#46514e" stroke="#6d8a85" stroke-width="2"/><rect x="576" y="256" width="192" height="1088" rx="5" fill="#46514e" stroke="#6d8a85" stroke-width="2"/><rect x="192" y="1344" width="576" height="128" rx="5" fill="#46514e" stroke="#6d8a85" stroke-width="2"/><rect x="192" y="96" width="576" height="192" rx="5" fill="#46514e" stroke="#6d8a85" stroke-width="2"/><rect x="384" y="1184" width="192" height="64" rx="5" fill="#786955" stroke="#d0b18b" stroke-width="2"/><text x="438" y="1225" font-family="Arial,sans-serif" font-size="24" fill="#ffffff">B1</text><path d="M398 1196 L562 1236" fill="none" stroke="#ea8c85" stroke-width="4"/><text x="402" y="1281" font-family="Arial,sans-serif" font-size="19" fill="#e9a7a0">LOCKED</text><rect x="384" y="768" width="192" height="64" rx="5" fill="#786955" stroke="#d0b18b" stroke-width="2"/><text x="438" y="809" font-family="Arial,sans-serif" font-size="24" fill="#ffffff">B2</text><text x="218" y="1425" font-family="Arial,sans-serif" font-size="25" fill="#e5edf0">SHARED COURTYARD</text><text x="245" y="70" font-family="Arial,sans-serif" font-size="26" fill="#ffe1ad">CASTLE / SHARED EXIT</text><rect x="448" y="96" width="64" height="192" rx="5" fill="#31403c" stroke="#dcba69" stroke-width="2"/><circle cx="480" cy="144" r="24" fill="#76e1a6"/><rect x="264" y="184" width="48" height="48" rx="5" fill="#ebc66b" stroke="#6d8a85" stroke-width="2"/><text x="240" y="260" font-family="Arial,sans-serif" font-size="20" fill="#ffe1ad">FINAL</text><rect x="648" y="184" width="48" height="48" rx="5" fill="#ebc66b" stroke="#6d8a85" stroke-width="2"/><text x="624" y="260" font-family="Arial,sans-serif" font-size="20" fill="#ffe1ad">FINAL</text><circle cx="288" cy="1312" r="27" fill="#bab1a0"/><text x="214" y="1350" font-family="Arial,sans-serif" font-size="22" fill="#ffd36c">BOULDER</text><rect x="236" y="1234" width="104" height="60" rx="5" fill="#68532e" stroke="#ffd36c" stroke-width="4"/><text x="210" y="1219" font-family="Arial,sans-serif" font-size="21" fill="#ffd36c">A · WEIGHT</text><rect x="236" y="706" width="104" height="60" rx="5" fill="#68532e" stroke="#ffd36c" stroke-width="4"/><text x="210" y="691" font-family="Arial,sans-serif" font-size="21" fill="#ffd36c">B · HEAVY ONLY</text><rect x="576" y="1112" width="192" height="16" rx="5" fill="#bd6662" stroke="#f0b2a7" stroke-width="3"/><rect x="192" y="1080" width="192" height="16" rx="5" fill="#bd6662" stroke="#f0b2a7" stroke-width="3"/><rect x="192" y="280" width="192" height="16" rx="5" fill="#bd6662" stroke="#f0b2a7" stroke-width="3"/><rect x="576" y="280" width="192" height="16" rx="5" fill="#bd6662" stroke="#f0b2a7" stroke-width="3"/><text x="593" y="1150" font-family="Arial,sans-serif" font-size="20" fill="#ffbbb4">COCO GATE 1</text><text x=