t-family="Arial,sans-serif" font-size="20" fill="#ffbbb4">SPIKE 2</text><rect x="192" y="852" width="128" height="56" rx="5" fill="#63393b" stroke="#eb9392" stroke-width="2"/><rect x="416" y="852" width="128" height="56" rx="5" fill="none" stroke="#eb9392" stroke-width="2"/><path d="M256 880 L480 880" fill="none" stroke="#eb9392" stroke-width="4" marker-end="url(#gold)" stroke-dasharray="7 6"/><path d="M480 900 L256 900" fill="none" stroke="#eb9392" stroke-width="3" marker-end="url(#gold)" stroke-dasharray="7 6"/><path d="M202 895 L211 865 L220 895 Z" fill="#e9b4b0"/><path d="M224 895 L233 865 L242 895 Z" fill="#e9b4b0"/><path d="M246 895 L255 865 L264 895 Z" fill="#e9b4b0"/><path d="M268 895 L277 865 L286 895 Z" fill="#e9b4b0"/><path d="M290 895 L299 865 L308 895 Z" fill="#e9b4b0"/><path d="M312 895 L321 865 L330 895 Z" fill="#e9b4b0"/><text x="195" y="840" font-family="Arial,sans-serif" font-size="20" fill="#ffbbb4">SPIKE 3</text><rect x="204" y="1116" width="168" height="52" rx="5" fill="#25423a" stroke="#85dbb1" stroke-width="2"/><text x="207" y="1150" font-family="Arial,sans-serif" font-size="19" fill="#b8efce">TRIAL START</text><path d="M288 1312 L288 1264 L288 1170 L288 1120 L288 1040 L288 960 L288 880 L288 736" fill="none" stroke="#ffd36c" stroke-width="8" marker-end="url(#gold)"/><path d="M514 1408 L672 1408 L672 1232 L672 1088 L672 800 L480 800" fill="none" stroke="#d4a5ff" stroke-width="7" marker-end="url(#purple)"/><path d="M480 815 L672 815 L672 208" fill="none" stroke="#d4a5ff" stroke-width="5" marker-end="url(#purple)" stroke-dasharray="10 9"/><path d="M288 700 L288 208" fill="none" stroke="#ffd36c" stroke-width="5" marker-end="url(#gold)" stroke-dasharray="10 9"/><rect x="645" y="1134" width="54" height="52" rx="5" fill="#734a8b" stroke="#d4a5ff" stroke-width="3"/><circle cx="672" cy="1180" r="8" fill="#f9efce"/><path d="M616 1160 L638 1160 M706 1160 L728 1160" fill="none" stroke="#d4a5ff" stroke-width="4" marker-end="url(#purple)"/><path d="M672 1232 L672 1187" fill="none" stroke="#d4a5ff" stroke-width="4" marker-end="url(#purple)" stroke-dasharray="6 6"/><text x="603" y="1290" font-family="Arial,sans-serif" font-size="19" fill="#e1c0ff">FRONT SHOT ↑</text><rect x="451" y="389" width="58" height="54" rx="5" fill="#734a8b" stroke="#d4a5ff" stroke-width="3"/><circle cx="480" cy="440" r="9" fill="#fff2bd"/><rect x="460" y="780" width="40" height="40" rx="5" fill="#255863" stroke="#91dfed" stroke-width="3"/><path d="M480 776 L480 450" fill="none" stroke="#d4a5ff" stroke-width="4" marker-end="url(#purple)" stroke-dasharray="6 6"/><text x="402" y="366" font-family="Arial,sans-serif" font-size="20" fill="#e1c0ff">FINAL TARGET</text><text x="411" y="484" font-family="Arial,sans-serif" font-size="18" fill="#e1c0ff">B3 REMOVED</text><text x="498" y="600" font-family="Arial,sans-serif" font-size="19" fill="#e1c0ff">12 tiles</text><path d="M288 1264 L352 1264 L608 1264 L608 1120 L672 1120" fill="none" stroke="#65d9df" stroke-width="3" stroke-dasharray="5 6"/><path d="M672 1160 L744 1160 L744 1120 L672 1120" fill="none" stroke="#65d9df" stroke-width="3" stroke-dasharray="5 6"/><path d="M672 1088 L608 1088 L352 1088 L288 1088" fill="none" stroke="#65d9df" stroke-width="3" stroke-dasharray="5 6"/><path d="M288 736 L352 736 L352 800 L480 800" fill="none" stroke="#65d9df" stroke-width="3" stroke-dasharray="5 6"/><path d="M480 416 L480 320 L288 320 L288 288 M480 320 L672 320 L672 288" fill="none" stroke="#65d9df" stroke-width="3" stroke-dasharray="5 6"/><circle cx="220" cy="1280" r="17" fill="#101e28"/><circle cx="220" cy="1280" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="214" y="1287" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">1</text><circle cx="748" cy="1200" r="17" fill="#101e28"/><circle cx="748" cy="1200" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="742" y="1207" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">2</text><circle cx="748" cy="1075" r="17" fill="#101e28"/><circle cx="748" cy="1075" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="742" y="1082" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">3</text><circle cx="215" cy="980" r="17" fill="#101e28"/><circle cx="215" cy="980" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="209" y="987" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">4</text><circle cx="220" cy="750" r="17" fill="#101e28"/><circle cx="220" cy="750" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="214" y="757" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">5</text><circle cx="550" cy="805" r="17" fill="#101e28"/><circle cx="550" cy="805" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="544" y="812" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">6</text><circle cx="538" cy="416" r="17" fill="#101e28"/><circle cx="538" cy="416" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="532" y="423" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">7</text><circle cx="744" cy="210" r="17" fill="#101e28"/><circle cx="744" cy="210" r="17" fill="none" stroke="#ffffff" stroke-width="2"/><text x="738" y="217" font-family="Arial,sans-serif" font-size="21" fill="#e5edf0">8</text></g><text x="780" y="190" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">1 · First weight plate + same boulder</text><text x="780" y="221" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Sieg pushes the starting boulder onto plate A.</text><text x="780" y="247" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">A player standing here cannot supply the weight.</text><text x="780" y="294" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">2 · Moving target: frontal hit required</text><text x="780" y="325" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Coco shoots north into its south-facing weak point.</text><text x="780" y="351" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Plate A occupied + valid target hit latch Gate 1 open.</text><text x="780" y="377" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Retrieving the boulder does NOT re-close Gate 1.</text><text x="780" y="424" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">3 · Coco’s golden switch</text><text x="780" y="455" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Beyond Gate 1, Coco opens Sieg’s spike entry.</text><text x="780" y="481" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">This unlock stays latched for subsequent retries.</text><text x="780" y="528" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">4 · Sideways spikes + physical transport</text><text x="780" y="559" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Each trap sweeps west stone edge ↔ water.</text><text x="780" y="585" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Dashed outlines show full withdrawal into the river.</text><text x="780" y="611" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Push SAME boulder through traps 1 → 2 → 3.</text><text x="780" y="637" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Super Speed boosts pushing; Slow Time slows spikes.</text><text x="780" y="684" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">5 · Large golden weight plate B</text><text x="780" y="715" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Only the boulder activates B; player weight = zero.</text><text x="780" y="741" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Sieg must leave the boulder on B to support Coco.</text><text x="780" y="788" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">6 · Second bridge: stabilized firing platform</text><text x="780" y="819" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">B occupied → B2 stable → Coco reaches center pad.</text><text x="780" y="845" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Full-width landings meet BOTH stone walkways.</text><text x="780" y="871" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Coco’s ward stops her before the west-bank landing.</text><text x="780" y="918" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">7 · Long shot replaces the THIRD bridge</text><text x="780" y="949" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">B3 is removed: final target now floats at its location.</text><text x="780" y="975" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Coco shoots north from B2 into the front weak point.</text><text x="780" y="1001" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Pad → target centers: 12 tiles / 384 world pixels.</text><text x="780" y="1027" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Hit permanently opens final gates and stabilizes B2.</text><text x="780" y="1074" font-family="Arial,sans-serif" font-size="23" fill="#ffe1ad">8 · Separate switches, shared castle exit</text><text x="780" y="1105" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">Sieg stays west; Coco returns to her east route.</text><text x="780" y="1131" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">They activate their final switches together,</text><text x="780" y="1157" font-family="Arial,sans-serif" font-size="19" fill="#e5edf0">opening the divider and shared northern exit.</text><rect x="48" y="1280" width="1344" height="176" rx="5" fill="#172830" stroke="#3c6470" stroke-width="2"/><text x="70" y="1314" font-family="Arial,sans-serif" font-size="23" fill="#9ae5d8">SAFE RETRIES — preserve completed earlier trials</text><text x="70" y="1350" font-family="Arial,sans-serif" font-size="20" fill="#e5edf0">Spike strikes boulder: stop transport; reset Sieg + the SAME boulder to the spike-trial start.</text><text x="70" y="1381" font-family="Arial,sans-serif" font-size="20" fill="#e5edf0">Plate B released before final hit: B2 collapses; return Coco to the east-bank landing. Boulder stays where pushed.</text><text x="70" y="1412" font-family="Arial,sans-serif" font-size="20" fill="#e5edf0">No auto-follow or normal checkpoint teleport. Earlier gate / switch unlocks remain completed on retries.</text><text x="70" y="1443" font-family="Arial,sans-serif" font-size="19" fill="#adc5cb">All transport uses swept server collisions; open bridges have no landing gaps. Bank wards prevent route bypasses.</text></svg>