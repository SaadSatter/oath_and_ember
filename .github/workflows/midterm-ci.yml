# Deterministic midterm checks (rubric 3c) for this repository.
# The course repository runs the same script through
# midterms/saadsatter/ci/midterm-saadsatter.yml, copied at transfer to
# game-dev-f26/.github/workflows/midterm-saadsatter.yml.
name: midterm-ci

on:
  push:
    branches: [main, midterm/evaluation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic checks (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Browser for the recorder and launcher tests
        run: npx playwright install --with-deps chromium
      - name: Typecheck, deterministic tests and build (no network, no model, no key)
        run: bash scripts/midterm/ci-checks.sh
