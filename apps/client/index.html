<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Oath & Ember</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="panel"></div>
    <div id="screen-ui">
      <div id="hud"></div>
      <div id="objective"></div>
      <div id="control-hints">
        WASD / arrows · J attack · K defense · E use · Space jump
      </div>
      <div id="debug" hidden></div>
    </div>
    <div id="notice" role="status"></div>
    <div id="special-abilities" aria-label="Special abilities" hidden>
      <button
        data-ability="push"
        aria-label="Push"
        title="Push · hold to use (E)"
      >
        <img src="/assets/ui/abilities/push.png" alt="" /><span>Push</span>
      </button>
      <button
        data-ability="super-speed"
        aria-label="Super Speed"
        title="Super Speed"
      >
        <span class="speed-icon" aria-hidden="true"
          ><img src="/assets/ui/abilities/super-speed.png" alt="" /></span
        ><span>Super Speed</span>
      </button>
      <button
        data-ability="time-stop"
        aria-label="Slow Time"
        title="Slow Time · unlock for 1 point"
        disabled
      >
        <span class="speed-icon" aria-hidden="true"
          ><img src="/assets/ui/abilities/time-stop.png" alt="" /></span
        ><span>Slow Time</span>
      </button>
    </div>
    <div id="touch">
      <div class="pad">
        <button data-key="ArrowUp">↑</button
        ><button data-key="ArrowLeft">←</button
        ><button data-key="ArrowDown">↓</button
        ><button data-key="ArrowRight">→</button>
      </div>
      <div class="actions">
        <button data-key="j">Strike</button><button data-key="k">Guard</button
        ><button data-key="e">Use</button><button data-key=" ">Jump</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
